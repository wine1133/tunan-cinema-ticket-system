server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
spring:
  application:
    name: tunan-cinema
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/tunan_cinema?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
app:
  jwt-secret: ${JWT_SECRET:tunan-cinema-2026-secret-key-change-in-production-please}
  jwt-hours: 72
  public-base-url: ${PUBLIC_BASE_URL:}
  ai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
logging:
  level:
    com.tunan.cinema.mapper: info
