services:
  mysql:
    image: mysql:8.0
    container_name: tunan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tunan_cinema
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - tunan_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tunan-cinema
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tunan_cinema?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-secret-in-production
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

volumes:
  tunan_mysql_data:
